<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img"
     aria-label="Assault bike: a fan bike with moving handles, arms and legs driving together">
  <rect width="640" height="440" fill="#191a1c"/>
  <path d="M60 398 H592" stroke="#3a3d40" stroke-width="9" stroke-linecap="round"/>

  <!-- fan wheel -->
  <g transform="translate(176 214)">
    <circle r="96" fill="none" stroke="#3a3d40" stroke-width="9"/>
    <circle r="78" fill="none" stroke="#26292b" stroke-width="3"/>
    <g stroke="#4a4e51" stroke-width="7" stroke-linecap="round" opacity="0.95">
      <path d="M0 0 L0 -74"/><path d="M0 0 L64 -37"/><path d="M0 0 L64 37"/>
      <path d="M0 0 L0 74"/><path d="M0 0 L-64 37"/><path d="M0 0 L-64 -37"/>
    </g>
    <circle r="15" fill="#3a3d40"/>
    <!-- motion arcs: the fan pushes back harder the faster you go -->
    <g fill="none" stroke="oklch(0.78 0.16 72)" stroke-width="4" stroke-linecap="round" opacity="0.75">
      <path d="M104 -34 A110 110 0 0 1 104 34"/>
      <path d="M122 -46 A134 134 0 0 1 122 46"/>
    </g>
  </g>

  <!-- frame -->
  <g stroke="#6b7073" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M176 310 H400"/>            <!-- base -->
    <path d="M400 310 V214"/>            <!-- seat post -->
    <path d="M360 214 H440"/>            <!-- seat -->
    <path d="M300 310 L300 398"/>        <!-- pedal crank arm -->
  </g>

  <!-- moving handles: one forward, one back -->
  <g stroke="#6b7073" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M232 214 L206 118"/>
    <path d="M232 214 L262 120"/>
  </g>

  <!-- rider -->
  <g fill="none" stroke="#f3f1ee" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M398 208 L372 150"/>                 <!-- torso, upright -->
    <path d="M398 212 L340 270 L300 312"/>        <!-- driving leg -->
    <path d="M398 212 L352 250 L322 214"/>        <!-- recovering leg -->
  </g>
  <g fill="none" stroke="#c8c5c1" stroke-width="13" stroke-linecap="round">
    <path d="M374 160 L262 124"/>                 <!-- arm pulling -->
    <path d="M374 166 L212 122"/>                 <!-- arm pushing -->
  </g>
  <circle cx="366" cy="126" r="26" fill="#f3f1ee"/>

  <text x="470" y="128" font-family="IBM Plex Sans, sans-serif" font-size="19" font-weight="600" fill="#c8c5c1">Arms push</text>
  <text x="470" y="154" font-family="IBM Plex Sans, sans-serif" font-size="19" font-weight="600" fill="#c8c5c1">and pull</text>
  <text x="470" y="352" font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#9ea2a6">Legs never stop</text>
  <text x="60" y="80" font-family="IBM Plex Mono, monospace" font-size="15" fill="oklch(0.82 0.15 72)">harder = heavier</text>
</svg>
