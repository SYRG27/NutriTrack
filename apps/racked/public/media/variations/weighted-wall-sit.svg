<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img"
     aria-label="Wall sit: back flat against a wall, thighs parallel to the floor, knees bent to ninety degrees">
  <rect width="640" height="440" fill="#191a1c"/>

  <!-- wall and floor -->
  <path d="M150 34 V404" stroke="#3a3d40" stroke-width="10" stroke-linecap="round"/>
  <path d="M150 404 H600" stroke="#3a3d40" stroke-width="10" stroke-linecap="round"/>
  <g stroke="#26292b" stroke-width="4" stroke-linecap="round">
    <path d="M132 70 l-16 -16"/><path d="M132 140 l-16 -16"/><path d="M132 210 l-16 -16"/>
    <path d="M132 280 l-16 -16"/><path d="M132 350 l-16 -16"/>
  </g>

  <!-- ninety degrees at the knee -->
  <path d="M292 268 h32 v32" fill="none" stroke="oklch(0.82 0.15 72)" stroke-width="3" opacity="0.55"/>
  <text x="300" y="258" font-family="IBM Plex Mono, monospace" font-size="15" fill="oklch(0.82 0.15 72)" opacity="0.8">90°</text>

  <!-- figure, side on, back flat to the wall -->
  <g fill="none" stroke="#f3f1ee" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M176 186 V300"/>            <!-- torso, flat against the wall -->
    <path d="M176 300 H324"/>            <!-- thigh, parallel to the floor -->
    <path d="M324 300 V398"/>            <!-- shin, vertical -->
    <path d="M324 398 H382"/>            <!-- foot -->
  </g>
  <path d="M188 214 L286 236" fill="none" stroke="#c8c5c1" stroke-width="13" stroke-linecap="round"/>
  <circle cx="186" cy="152" r="29" fill="#f3f1ee"/>

  <!-- contact points -->
  <circle cx="163" cy="200" r="7" fill="oklch(0.78 0.16 72)"/>
  <circle cx="163" cy="292" r="7" fill="oklch(0.78 0.16 72)"/>
  <text x="404" y="196" font-family="IBM Plex Sans, sans-serif" font-size="19" font-weight="600" fill="#c8c5c1">Back flat,</text>
  <text x="404" y="222" font-family="IBM Plex Sans, sans-serif" font-size="19" font-weight="600" fill="#c8c5c1">shoulders and</text>
  <text x="404" y="248" font-family="IBM Plex Sans, sans-serif" font-size="19" font-weight="600" fill="#c8c5c1">hips touching</text>
  <text x="404" y="352" font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#9ea2a6">Weight in the heels</text>
</svg>
