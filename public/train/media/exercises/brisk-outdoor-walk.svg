<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img"
     aria-label="Brisk outdoor walk: walking outside at a pace where talking is slightly harder than usual">
  <rect width="640" height="440" fill="#191a1c"/>
  <!-- horizon and a path going away -->
  <path d="M0 330 H640" stroke="#26292b" stroke-width="3"/>
  <path d="M250 330 L150 420 H520 L390 330 Z" fill="#202325"/>
  <g stroke="#3a3d40" stroke-width="5" stroke-linecap="round">
    <path d="M318 344 v14"/><path d="M316 372 v18"/><path d="M313 404 v22"/>
  </g>
  <!-- a few hills -->
  <path d="M40 330 q70 -62 140 0" fill="none" stroke="#2e3234" stroke-width="5"/>
  <path d="M430 330 q84 -74 168 0" fill="none" stroke="#2e3234" stroke-width="5"/>

  <!-- walker, mid-stride, side on -->
  <g fill="none" stroke="#f3f1ee" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 168 V262"/>                 <!-- torso, tall -->
    <path d="M300 262 L262 336 L246 388"/>    <!-- leading leg -->
    <path d="M300 262 L344 330 L370 384"/>    <!-- trailing leg -->
  </g>
  <g fill="none" stroke="#c8c5c1" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 190 L268 234 L286 264"/>    <!-- arms swinging -->
    <path d="M300 192 L336 232 L322 268"/>
  </g>
  <circle cx="300" cy="140" r="27" fill="#f3f1ee"/>

  <text x="60" y="76" font-family="IBM Plex Mono, monospace" font-size="15" fill="oklch(0.82 0.15 72)">no machine needed</text>
  <text x="400" y="172" font-family="IBM Plex Sans, sans-serif" font-size="19" font-weight="600" fill="#c8c5c1">Brisk enough</text>
  <text x="400" y="198" font-family="IBM Plex Sans, sans-serif" font-size="19" font-weight="600" fill="#c8c5c1">that talking</text>
  <text x="400" y="224" font-family="IBM Plex Sans, sans-serif" font-size="19" font-weight="600" fill="#c8c5c1">is harder</text>
  <text x="60" y="424" font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#9ea2a6">30–45 min · after a meal is ideal</text>
</svg>
